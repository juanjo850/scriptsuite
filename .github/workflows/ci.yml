name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,docs]"
      - name: ruff check
        run: ruff check src tests tools
      - name: ruff format
        run: ruff format --check src tests tools

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: fast tests
        run: pytest -m "not integration" -q
      - name: integration tests
        run: pytest -m integration -q --timeout=180
      - name: coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: pytest -q --cov=scriptsuite --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        with:
          name: coverage
          path: coverage.xml

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]" build twine
      - run: python -m build
      - run: twine check dist/*
      - name: install the wheel in a clean environment
        run: |
          python -m venv /tmp/scriptsuite-wheel
          /tmp/scriptsuite-wheel/bin/pip install dist/*.whl
          /tmp/scriptsuite-wheel/bin/scriptsuite --version
          /tmp/scriptsuite-wheel/bin/scriptsuite --list script
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  docs:
    name: docs are up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,docs]"
      - run: python tools/build_docs.py
      - run: git diff --exit-code -- docs/
