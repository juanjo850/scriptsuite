[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scriptsuite"
dynamic = ["version"]
description = "A modern terminal workspace for discovering, running and inspecting test scripts in real time."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "juanjo850" }]
keywords = ["tui", "textual", "test-runner", "scripts", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "rich>=13",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
    "twine>=5.0",
]
docs = [
    "markdown-it-py>=2.1",
    "pygments>=2.19",
]

[project.urls]
Homepage = "https://github.com/juanjo850/scriptsuite"
Repository = "https://github.com/juanjo850/scriptsuite"
Issues = "https://github.com/juanjo850/scriptsuite/issues"
Changelog = "https://github.com/juanjo850/scriptsuite/blob/main/CHANGELOG.md"

[project.scripts]
scriptsuite = "scriptsuite.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "scriptsuite.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scriptsuite = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers --strict-config --durations=10"
timeout = 120
markers = [
    "integration: uses real child processes or pseudo-terminals",
    "slow: takes more than a few seconds",
]

[tool.coverage.run]
branch = true
source = ["scriptsuite"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.ruff]
line-length = 90
target-version = "py311"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]